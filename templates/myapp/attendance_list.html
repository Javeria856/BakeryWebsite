{% extends 'myapp/base.html' %}
{% block title %}Attendance{% endblock %}

{% block content %}
<a href="{% url 'attendance_add' %}" class="btn btn-add">+ Add Attendance</a>
<br><br>

<table>
    <tr>
        <th>Staff</th>
        <th>Date</th>
        <th>In Time</th>
        <th>Out Time</th>
        <th>Actions</th>
    </tr>

    {% for a in attendance %}
    <tr>
        <td>{{ a.staff.name }}</td>
        <td>{{ a.date }}</td>
        <td>{{ a.in_time }}</td>
        <td>{{ a.out_time }}</td>
        <td>
            <a href="{% url 'attendance_edit' a.id %}" class="btn btn-edit">Edit</a>
            <a href="{% url 'attendance_delete' a.id %}" class="btn btn-delete">Delete</a>
        </td>
    </tr>
    {% endfor %}
</table>
{% endblock %}
