{% extends 'myapp/base.html' %}
{% block title %}Inventory{% endblock %}

{% block content %}
<a href="{% url 'inventory_add' %}" class="btn btn-add">+ Add Item</a>

<table>
<tr>
    <th>Name</th><th>Quantity</th><th>Unit</th><th>Actions</th>
</tr>
{% for i in items %}
<tr>
    <td>{{ i.item_name }}</td>
    <td>{{ i.quantity }}</td>
    <td>{{ i.unit }}</td>
    <td>
        <a href="{% url 'inventory_edit' i.id %}" class="btn btn-edit">Edit</a>
        <a href="{% url 'inventory_delete' i.id %}" class="btn btn-delete">Delete</a>
    </td>
</tr>
{% endfor %}
</table>
{% endblock %}
