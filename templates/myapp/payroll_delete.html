{% extends 'myapp/base.html' %}
{% block title %}Delete Payroll{% endblock %}

{% block content %}
<p>Are you sure you want to delete payroll for <strong>{{ payroll.staff.name }}</strong> dated {{ payroll.pay_date }}?</p>
<form method="post">
    {% csrf_token %}
    <button class="btn btn-delete">Yes, Delete</button>
    <a href="{% url 'payroll_list' %}" class="btn btn-edit">Cancel</a>
</form>
{% endblock %}
