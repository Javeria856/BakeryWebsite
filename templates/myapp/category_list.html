{% extends 'myapp/base.html' %}
{% block title %}Product Categories{% endblock %}

{% block content %}
<a href="{% url 'category_add' %}" class="btn btn-add">+ Add Category</a>

<table>
<tr>
    <th>Name</th>
    <th>Actions</th>
</tr>
{% for c in categories %}
<tr>
    <td>{{ c.category_name }}</td>
    <td>
        <a href="{% url 'category_edit' c.id %}" class="btn btn-edit">Edit></a> |
        <a href="{% url 'category_delete' c.id %}" 
           onclick="return confirm('Delete this category?')"  class="btn btn-delete">Delete</a>
    </td>
</tr>
{% endfor %}
</table>

{% endblock %}
