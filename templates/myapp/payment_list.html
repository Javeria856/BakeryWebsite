{% extends 'myapp/base.html' %}
{% block title %}Payments{% endblock %}

{% block content %}
<a href="{% url 'payment_add' %}" class="btn btn-add">+ Add Payment</a>

<table>
    <tr>
        <th>ID</th>
        <th>Order</th>
        <th>Amount</th>
        <th>Date</th>
        <th>Method</th>
        <th>Actions</th>
    </tr>
    {% for p in payments %}
    <tr>
        <td>{{ p.id }}</td>
        <td>{{ p.order }}</td>
        <td>{{ p.amount }}</td>
        <td>{{ p.payment_date }}</td>
        <td>{{ p.method }}</td>
        <td>
            <a href="{% url 'payment_edit' p.id %}" class="btn btn-edit">Edit</a>
            <a href="{% url 'payment_delete' p.id %}" class="btn btn-delete">Delete</a>
        </td>
    </tr>
    {% endfor %}
</table>
{% endblock %}
