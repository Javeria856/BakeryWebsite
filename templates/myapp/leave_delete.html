{% extends 'myapp/base.html' %}
{% block title %}Delete Leave{% endblock %}

{% block content %}
<p>Are you sure you want to delete leave request for <strong>{{ leave.staff.name }}</strong>?</p>
<form method="post">
    {% csrf_token %}
    <button class="btn btn-delete">Yes, Delete</button>
    <a href="{% url 'leave_list' %}" class="btn btn-edit">Cancel</a>
</form>
{% endblock %}
