{% extends 'myapp/base.html' %}
{% block title %}Deliveries{% endblock %}
{% block content %}

<a href="{% url 'delivery_add' %}" class="btn btn-add">+ Add Delivery</a>

<table>
<tr>
    <th>Order</th><th>Staff</th><th>Date</th><th>Status</th><th>Actions</th>
</tr>
{% for d in deliveries %}
<tr>
    <td>#{{ d.order.id }}</td>
    <td>{{ d.staff.name }}</td>
    <td>{{ d.delivery_date }}</td>
    <td>{{ d.status }}</td>
    <td>
        <a href="{% url 'delivery_edit' d.id %}" class="btn btn-edit">Edit</a>
        <a href="{% url 'delivery_delete' d.id %}" class="btn btn-delete">Delete</a>
    </td>
</tr>
{% endfor %}
</table>

{% endblock %}
