{% extends 'myapp/base.html' %}
{% block title %}Customers{% endblock %}
{% block content %}

<a href="{% url 'customer_add' %}" class="btn btn-add">Add Customer</a>

<table>
<tr>
    <th>Name</th>
    <th>Phone</th>
    <th>Email</th>
    <th>Actions</th>
</tr>
{% for c in customers %}
<tr>
    <td>{{ c.name }}</td>
    <td>{{ c.phone }}</td>
    <td>{{ c.email }}</td>
    <td>
        <a href="{% url 'customer_edit' c.id %}" class="btn btn-edit">Edit</a>
        <a href="{% url 'customer_delete' c.id %}" class="btn btn-delete"
           onclick="return confirm('Delete customer?')">Delete</a>
    </td>
</tr>
{% endfor %}
</table>

{% endblock %}
