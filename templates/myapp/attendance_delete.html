{% extends 'myapp/base.html' %}
{% block title %}Delete Attendance{% endblock %}

{% block content %}
<p>
    Are you sure you want to delete attendance for
    <strong>{{ record.staff.name }}</strong>
    on {{ record.date }}?
</p>

<form method="post">
    {% csrf_token %}
    <button class="btn btn-delete">Yes, Delete</button>
    <a href="{% url 'attendance_list' %}" class="btn btn-edit">Cancel</a>
</form>
{% endblock %}
