{% extends 'myapp/base.html' %}
{% block title %}Recipe Ingredients{% endblock %}
{% block content %}

<a href="{% url 'recipe_ingredient_add' %}" class="btn btn-add">Add Ingredient</a>

<table>
<tr>
    <th>Recipe</th>
    <th>Inventory Item</th>
    <th>Quantity</th>
    <th>Actions</th>
</tr>
{% for i in items %}
<tr>
    <td>{{ i.recipe.product.name }}</td>
    <td>{{ i.inventory.item_name }}</td>
    <td>{{ i.quantity }}</td>
    <td>
        <a href="{% url 'recipe_ingredient_edit' i.id %}" class="btn btn-edit">Edit</a>
        <a href="{% url 'recipe_ingredient_delete' i.id %}" class="btn btn-delete"
           onclick="return confirm('Delete ingredient?')">Delete</a>
    </td>
</tr>
{% endfor %}
</table>

{% endblock %}
