{% extends 'myapp/base.html' %}
{% block title %}Order Details{% endblock %}

{% block content %}
<a href="{% url 'order_detail_add' %}" class="btn btn-add">+ Add Order Item</a>

<table>
    <tr>
        <th>ID</th>
        <th>Order</th>
        <th>Product</th>
        <th>Quantity</th>
        <th>Price</th>
        <th>Actions</th>
    </tr>
    {% for d in details %}
    <tr>
        <td>{{ d.id }}</td>
        <td>{{ d.order }}</td>
        <td>{{ d.product }}</td>
        <td>{{ d.quantity }}</td>
        <td>{{ d.price }}</td>
        <td>
            <a href="{% url 'order_detail_edit' d.id %}" class="btn btn-edit">Edit</a>
            <a href="{% url 'order_detail_delete' d.id %}" class="btn btn-delete">Delete</a>
        </td>
    </tr>
    {% endfor %}
</table>
{% endblock %}
