{% extends 'myapp/base.html' %}
{% block title %}Customer Addresses{% endblock %}
{% block content %}

<a href="{% url 'customer_address_add' %}" class="btn btn-add">Add Address</a>

<table>
<tr>
    <th>Customer</th>
    <th>Address</th>
    <th>City</th>
    <th>Actions</th>
</tr>
{% for a in addresses %}
<tr>
    <td>{{ a.customer.name }}</td>
    <td>{{ a.address }}</td>
    <td>{{ a.city }}</td>
    <td>
        <a href="{% url 'customer_address_edit' a.id %}" class="btn btn-edit">Edit</a>
        <a href="{% url 'customer_address_delete' a.id %}" class="btn btn-delete"
           onclick="return confirm('Delete address?')">Delete</a>
    </td>
</tr>
{% endfor %}
</table>

{% endblock %}
